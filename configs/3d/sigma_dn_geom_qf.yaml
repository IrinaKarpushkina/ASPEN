# Сгенерировано scripts/make_qf_config.py из sigma_dn_geom.yaml.
# Отличие от sigma_dn_geom ТОЛЬКО в голове: квантильная функция вместо softmax по бинам + проекции момента.
defaults: base.yaml
features: sasa
training:
  max_epochs: 200
  patience: 45
  scheduler_T0: 40
  scheduler_Tmult: 1
model:
  name: sigma_dn_geom_qf
  backbone: dimenet
  input_dim: 25
  hidden_channels: 118
  out_emb_channels: 118
  num_blocks: 3
  int_emb_size: 32
  basis_emb_size: 8
  num_spherical: 7
  num_radial: 6
  num_before_skip: 1
  num_after_skip: 2
  num_output_layers: 2
  dropout: 0.05
  use_global: false
  global_layers: 2
  global_heads: 2
  use_geom_area: true
  neutral: false
  head: quantile
  n_knots: 128
  tau_kind: cos
  gap_eps: 0.0001
loss:
  name: physics
  w_profile: 1.0
  w_area: 0.05
  w_charge: 0.05
  w_moments: 0.02
  w_smooth: 0.01
  w_wasserstein: 0.1
  w_polar: 0.1
