defaults: ../base_2d.yaml

# GINE использует edge_attr через GINEConv(edge_dim=...).
# В 2D: edge_dim=7 (против 39 в 3D) → экономит ~27k параметров.
# hidden=211 даёт ~668k params (−3.9% от бюджета, в пределах ±5%).
# Для точной настройки: python -m scripts.count_params --configs-dir configs/2d --auto-tune
model:
  name: gine
  hidden: 216
  num_layers: 4
  n_rbf: 32      # игнорируется в 2d_pure, но нужен для edge_feat_dim()
  dropout: 0.05
  n_params_target: 695667
